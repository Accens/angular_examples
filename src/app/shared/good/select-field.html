<div class="field">
  <label [for]="id">{{ label() }}</label>
  <select
    [id]="id"
    [disabled]="disabled()"
    [attr.aria-invalid]="showError() ? 'true' : null"
    [attr.aria-describedby]="showError() ? id + '-error' : null"
    (change)="onSelect($event)"
    (blur)="onBlur()"
  >
    <option value="" [selected]="value() === ''">Wybierz</option>
    @for (o of options(); track o.value) {
      <option [value]="o.value" [selected]="o.value === value()">{{ o.label }}</option>
    }
  </select>
  @if (showError()) {
    <p [id]="id + '-error'" class="error-text">
      <span aria-hidden="true">⚠ </span><span class="visually-hidden">Błąd: </span>{{ errorText() }}
    </p>
  }
</div>
